name: 데이터 갱신

on:
  schedule:
    - cron: "17 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 계산 실행
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python engine/update.py
      - name: 결과 커밋
        run: |
          mkdir -p data/cache
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data.json data/cache
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
          git push
